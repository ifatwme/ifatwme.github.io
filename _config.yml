title: Fatemeh Ghasemi
tagline: Computer engineer · machine learning and the systems around it
description: >-
  Personal site of Fatemeh Ghasemi: computer engineer working on machine
  learning and the engineering around it. Writing, projects and research.

author:
  name: Fatemeh Ghasemi
  email: ifatwmeghasemi@gmail.com
  avatar: /assets/img/avatar.jpg   # leave empty to show initials instead
  cv:                              # e.g. /assets/files/cv.pdf  (empty = no CV link)

# Profiles shown as icons on the home page and in the footer.
# Comment out a line to hide it; uncomment to add one.
profiles:
  github: ifatwme
  linkedin: fatwme
  # scholar: https://scholar.google.com/citations?user=XXXX
  # orcid: 0000-0000-0000-0000

url: https://ifatwme.github.io
baseurl: ""
lang: en
timezone: Asia/Tehran

# ─────────────────────────────────────────────────────────────────────────────
#  Build settings — rarely need touching.
# ─────────────────────────────────────────────────────────────────────────────
permalink: /blog/:year/:title/
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "" }
    values: { layout: page }

exclude:
  - README.md
  - Makefile
  - docker-compose.yml
  - bin/
  - Gemfile
  - Gemfile.lock
  - .ruby-version
  - vendor/
  - .bundle/
  - .jekyll-cache/
  - node_modules/
