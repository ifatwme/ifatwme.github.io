# Local preview: `make serve`, then open http://localhost:4000 (reloads as you edit).
services:
  site:
    image: ruby:3.3
    working_dir: /site
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      HOME: /tmp
      BUNDLE_PATH: /site/vendor/bundle
      JEKYLL_ENV: development
    command: >-
      sh -c "bundle install --quiet &&
             bundle exec jekyll serve --host 0.0.0.0 --livereload --drafts --force_polling"
    ports:
      - "127.0.0.1:4000:4000"
      - "127.0.0.1:35729:35729"
    volumes:
      - .:/site
