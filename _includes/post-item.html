<li class="post-item">
  <time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: "%b %-d, %Y" }}</time>
  <div>
    <a class="post-link" href="{{ include.post.url | relative_url }}"{% if include.post.lang == "fa" %} dir="rtl" lang="fa"{% endif %}>{{ include.post.title }}</a>
    {%- if include.post.description %}
    <p class="post-desc"{% if include.post.lang == "fa" %} dir="rtl" lang="fa"{% endif %}>{{ include.post.description }}</p>
    {%- endif %}
  </div>
</li>
